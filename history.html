<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback &amp; version history — What is your blood telling you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --font-serif:Georgia,"Times New Roman",serif;
 --font-sans:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
 --teal:#007385;--slate:#24434D;--accent:#B84A0E;--warm:#F09A57;
 --aqua:#EAF7F8;--paper:#F7F9F9;--ink:#1D1B1A;--muted:#5A6B70;
 --line:#D7E1E2;--panel:#fff;--dim:#8B9799;--ok:#2E7D5B;--warn:#B8860B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.5;overflow:hidden}
a{color:var(--teal)}
button{font-family:inherit;cursor:pointer}

#shell{position:fixed;inset:0;display:grid;grid-template-columns:326px 1fr;grid-template-rows:auto 1fr}
header.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:12px 22px;
 border-bottom:1px solid var(--line);background:var(--panel);z-index:5;flex-wrap:wrap}
header.top .logo{font-family:var(--font-serif);font-size:18px;color:var(--slate);font-weight:700}
header.top .logo b{color:var(--teal)}
header.top .tag{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
header.top .spacer{flex:1}
header.top .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--dim)}
header.top .home{border:1px solid var(--line);background:#fff;color:var(--slate);font-size:12px;
 font-weight:600;padding:5px 12px;border-radius:16px;text-decoration:none}
header.top .home:hover{border-color:var(--teal);color:var(--teal)}

/* ---------- rail ---------- */
#rail{grid-row:2;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:16px 15px 60px}
#rail::-webkit-scrollbar{width:8px}#rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.railhead{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
 color:var(--dim);margin:0 0 9px;padding-left:2px;display:flex;align-items:baseline;gap:7px}
.railhead.two{margin-top:22px;border-top:1px solid var(--line);padding-top:15px}
.railhead em{font-style:normal;color:#b9c4c6}
.vlist{position:relative;padding-left:19px}
.vlist::before{content:'';position:absolute;left:5px;top:9px;bottom:9px;width:1.5px;background:var(--line)}
.vitem{position:relative;display:block;width:100%;text-align:left;background:none;border:1px solid transparent;
 border-radius:10px;padding:8px 10px;margin:0 0 3px;transition:.14s}
.vitem::before{content:'';position:absolute;left:-18px;top:14px;width:9px;height:9px;border-radius:50%;
 background:#fff;border:2px solid var(--line)}
.vitem:hover{background:var(--paper);border-color:var(--line)}
.vitem.on{background:var(--aqua);border-color:var(--teal)}
.vitem.on::before{border-color:var(--teal);background:var(--teal)}
.vitem.st-live::before{border-color:var(--ok);background:var(--ok)}
.vitem.st-candidate::before{border-color:var(--accent);background:#fff}
.vitem.st-superseded::before{border-color:var(--dim);background:#fff}
.vitem.st-addressed::before{border-color:var(--ok);background:#fff}
.vitem.st-partial::before{border-color:var(--warn);background:var(--warn)}
.vitem.st-open::before{border-color:var(--accent);background:var(--accent)}
.vitem .vt{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.vitem .vid{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--teal)}
.vitem.st-live .vid{color:var(--ok)}
.vitem.st-candidate .vid{color:var(--accent)}
.vitem.st-superseded .vid{color:var(--dim)}
.vitem .vd{font-family:var(--font-mono);font-size:9.5px;color:var(--dim);margin-left:auto}
.vitem .vn{font-family:var(--font-serif);font-size:14px;color:var(--slate);font-weight:700;
 display:block;margin:1px 0 2px;line-height:1.3}
.vitem .vs{font-size:11px;color:var(--muted);line-height:1.45;display:block}
.chip{display:inline-block;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.05em;
 text-transform:uppercase;padding:1px 6px;border-radius:8px;color:#fff}
.chip.live{background:var(--ok)}
.chip.candidate{background:var(--accent)}
.chip.superseded{background:var(--dim)}
.chip.addressed{background:var(--ok)}
.chip.partial{background:var(--warn)}
.chip.open{background:var(--accent)}

/* ---------- main ---------- */
#pane{grid-row:2;overflow-y:auto;padding:0 0 60px}
#pane::-webkit-scrollbar{width:10px}#pane::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.pwrap{max-width:1000px;margin:0 auto;padding:22px 26px 0}
.phead{display:flex;align-items:flex-start;gap:13px;flex-wrap:wrap;margin-bottom:4px}
.phead h1{font-family:var(--font-serif);font-size:25px;color:var(--slate);margin:0}
.pid{font-family:var(--font-mono);font-size:12px;font-weight:600;padding:2px 9px;border-radius:12px;
 white-space:nowrap;color:var(--accent);border:1px solid #f0cdb6;background:#fdf1ea}
.pid.live{color:var(--ok);border-color:#b9ddc9;background:#e9f5ee}
.pid.addressed{color:var(--ok);border-color:#b9ddc9;background:#e9f5ee}
.pid.partial{color:var(--warn);border-color:#e6d5a6;background:#fbf3e0}
.pid.superseded{color:var(--dim);border-color:var(--line);background:#f2f5f5}
.pmeta{font-family:var(--font-mono);font-size:11px;color:var(--dim);margin:2px 0 10px;display:flex;gap:14px;flex-wrap:wrap}
.psum{font-size:14px;color:var(--muted);margin:0 0 16px;max-width:780px}

.sec{margin:24px 0 0}
.sec h2{font-family:var(--font-serif);font-size:18px;color:var(--slate);margin:0 0 8px}
.sec .sub{font-size:12.5px;color:var(--muted);margin:-4px 0 10px;max-width:780px}
code{font-family:var(--font-mono);font-size:.88em;background:var(--aqua);color:var(--slate);padding:1px 5px;border-radius:4px}

/* quote block */
.quotes{border-left:3px solid var(--warm);padding:2px 0 2px 17px;margin:0;max-width:820px}
.quotes p{font-family:var(--font-serif);font-size:14.5px;color:var(--slate);line-height:1.6;margin:0 0 11px;font-style:italic}
.quotes p:last-child{margin-bottom:0}
.qattr{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:9px;letter-spacing:.04em}

/* did-list: one row per sub-point with its own status */
.did{list-style:none;padding:0;margin:0;max-width:860px}
.did li{display:grid;grid-template-columns:88px 1fr;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.did li:last-child{border-bottom:none}
.did .st{font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;
 padding:2px 0;text-align:right;padding-top:3px}
.did .st.addressed{color:var(--ok)}
.did .st.partial{color:var(--warn)}
.did .st.open{color:var(--accent)}
.did .tt{font-size:13.5px;color:var(--slate);font-weight:600;margin:0 0 3px;line-height:1.4}
.did .rr{font-size:12.5px;color:var(--muted);margin:0;line-height:1.55}
.did .rr b{color:var(--slate)}

.chg{list-style:none;padding:0;margin:0}
.chg li{position:relative;padding:0 0 0 20px;margin:0 0 8px;font-size:13.5px;color:var(--muted);line-height:1.55;max-width:840px}
.chg li::before{content:'';position:absolute;left:4px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--warm)}
.chg li b{color:var(--slate)}

.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:9px;
 padding:12px 15px;font-size:12.5px;color:var(--muted);margin:14px 0 0;max-width:840px;line-height:1.6}
.note.warn{border-left-color:var(--accent);background:#fdf6f2}
.note h4{font-family:var(--font-serif);font-size:14.5px;color:var(--slate);margin:0 0 5px}

.links{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0}
.lk{border:1px solid var(--line);background:#fff;color:var(--slate);font-family:var(--font-mono);
 font-size:11px;padding:4px 11px;border-radius:14px}
.lk:hover{border-color:var(--teal);color:var(--teal)}
.lk b{color:var(--teal);font-weight:600}

/* overview */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 6px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.tile b{font-family:var(--font-serif);font-size:31px;font-weight:700;display:block;line-height:1}
.tile.a b{color:var(--ok)}.tile.b b{color:var(--warn)}.tile.c b{color:var(--accent)}
.tile span{font-size:12px;color:var(--muted);display:block;margin-top:5px}
.ledger{width:100%;border-collapse:collapse;margin-top:4px;max-width:900px}
.ledger th{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
 color:var(--dim);text-align:left;font-weight:400;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
.ledger td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);vertical-align:top}
.ledger tr{cursor:pointer}
.ledger tr:hover td{background:var(--aqua)}
.ledger .lid{font-family:var(--font-mono);font-size:11px;color:var(--teal);font-weight:600;white-space:nowrap}
.ledger .ltt{color:var(--slate);font-weight:600}
.ledger .lv{font-family:var(--font-mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
.cons{list-style:none;padding:0;margin:0;max-width:840px}
.cons li{padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.cons li:last-child{border-bottom:none}
.cons b{color:var(--slate);display:inline-block;min-width:170px}

/* preview */
.ptools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.ptool{border:1px solid var(--line);background:#fff;color:var(--slate);font-size:12px;font-weight:600;padding:5px 12px;border-radius:16px}
.ptool:hover{border-color:var(--teal);color:var(--teal)}
.ptool.on{background:var(--teal);border-color:var(--teal);color:#fff}
.ptools .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;color:var(--dim);text-transform:uppercase}
.ptools .spacer{flex:1}
.popen{border:1px solid var(--teal);background:var(--teal);color:#fff;font-size:12px;font-weight:700;
 padding:6px 14px;border-radius:16px;text-decoration:none;display:inline-block}
.popen:hover{background:#005e6d}
.frame{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;display:flex;
 justify-content:center;position:relative;min-height:200px}
.frame .vp{width:100%;transition:width .22s ease}
.frame iframe{width:100%;height:600px;border:1px solid var(--line);border-radius:7px;background:#fff;display:block}
.frame .load{position:absolute;inset:9px;display:flex;align-items:center;justify-content:center;
 background:var(--paper);border-radius:7px;font-family:var(--font-mono);font-size:11.5px;color:var(--dim);
 z-index:2;text-align:center;padding:20px}
.frame .load.gone{display:none}
.fnote{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin:7px 0 0;text-align:center}

.roll{background:var(--slate);border-radius:12px;padding:17px 19px;margin:14px 0 0;max-width:840px}
.roll h3{font-family:var(--font-serif);font-size:16px;color:#fff;margin:0 0 4px}
.roll p{font-size:12.5px;color:#c8d5d7;margin:0 0 11px;line-height:1.55}
.roll code{background:rgba(255,255,255,.12);color:#eaf3f4}
.cmd{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
 border-radius:8px;padding:8px 10px;margin:0 0 7px}
.cmd code{flex:1;background:none;color:#eaf3f4;font-size:11.5px;padding:0;white-space:pre-wrap;word-break:break-all}
.cmd button{border:1px solid rgba(255,255,255,.25);background:none;color:#c8d5d7;font-family:var(--font-mono);
 font-size:10px;padding:3px 9px;border-radius:12px;white-space:nowrap}
.cmd button:hover{border-color:var(--warm);color:var(--warm)}
.cmd button.done{color:var(--warm);border-color:var(--warm)}
.rolllab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#8fa6ab;margin:11px 0 4px}
.rolllab:first-of-type{margin-top:0}
.foot{font-size:11.5px;color:var(--dim);margin:30px 0 0;max-width:840px;line-height:1.6}
.foot code{background:#eef2f2}
@media(max-width:900px){
 #shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
 #rail{grid-row:2;border-right:none;border-bottom:1px solid var(--line);max-height:220px}
 #pane{grid-row:3}
 .tiles{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="shell">
 <header class="top">
  <span class="logo">What is your blood telling you<b>?</b></span>
  <span class="tag">feedback &amp; version history</span>
  <span class="spacer"></span>
  <span class="meta" id="hdrMeta"></span>
  <a class="home" href="index.html">Open live site &rarr;</a>
 </header>

 <aside id="rail">
  <div class="vlist" id="oList"></div>
  <p class="railhead two" id="fHead">Feedback</p>
  <div class="vlist" id="fList"></div>
  <p class="railhead two">Versions <em>newest first</em></p>
  <div class="vlist" id="vList"></div>
  <p class="railhead two">Reference artifacts</p>
  <div class="vlist" id="rList"></div>
 </aside>

 <main id="pane"><div class="pwrap" id="pwrap"></div></main>
</div>

<script>
"use strict";
const MANIFEST = {"generated": "2026-07-31T19:22:50Z", "live": "index.html", "constraints": [["No hallucination", "Every claim carries a credible reference with a link so it can be verified."], ["Quote, don't rephrase", "Summaries quote the source verbatim rather than paraphrasing it."], ["GoInvo style guide", "Sites follow <code>goinvo-style-guide.md</code>."]], "feedback": [{"id": "F8", "date": "2026-07-31", "who": "Chloe", "title": "Make the map readable — let it float and spread", "status": "addressed", "versions": ["v2.1"], "quote": "find a smarter way to make these readable, can be more spread out organically floating moving in the empty space, or other ways you see fitting", "did": [["Fixed rings replaced by a force simulation", "addressed", "Nodes now float and settle where there is room. Three soft rules: a radial band per role, concerns pulled toward the markers that implicate them, and everything repelling everything. No node may enter a panel."], ["Dormant concerns get out of the way", "addressed", "The old ring gave all 47 concerns an equal slot whether or not they were in play. Now live concerns pull inward and grow; the other 44 drift to the edge as small dots. The crowding was structural, not cosmetic."], ["Labels are placed, not just drawn", "addressed", "Each frame, labels are sorted by importance and placed greedily — right, left, above, below — taking the first slot that collides with nothing already placed. A label that cannot fit is dropped rather than overlapped. Measured across four window sizes and every interaction state: <b>zero label collisions</b>."], ["Bands are elliptical, not circular", "addressed", "The free area between the panels is far wider than it is tall, so a circular layout left a third of the screen empty. Normalising into unit space and scaling back out fills the rectangle."], ["Ambient drift", "addressed", "Every node carries its own phase and breathes slowly even at rest, so the map reads as alive rather than as a diagram. Honoured <code>prefers-reduced-motion</code>."], ["Ripple made literal", "addressed", "Edges from a marker you have marked abnormal animate outward with a flowing dash, so the ripple travels rather than merely existing."], ["Panels still never move", "addressed", "The organic motion is confined to the map. Rails, detail slots and scroll gutters remain fixed exactly as [[F7]] asked — the two requirements do not conflict once motion is scoped to the canvas."]], "open": null}, {"id": "F7", "date": "2026-07-31", "who": "Chloe", "title": "A different atlas: start from the annual panel and ripple outward", "status": "partial", "versions": ["v2.0"], "quote": "overall, the atlas should show the ripple effect of the abnormal findings user explore, not just data lists", "quotes": ["start with annual blood routine, show the potential concerns each/multiple markers can represent", "for each concern raised, click into it should what additional blood tests need to be done to confirm", "all interactions and panels and scroll bars are fixed and reserved space on screen, so any clicks and interaction user has won't shift content on screen", "when biomarkers relate to one another, contain little fun fact on how they relate across physiology etc.", "on top of what normal blood routine shows, user can add additional personal concerns of their health on another layer, which introduce more suggestions in blood works, related content might also reveal which tests have never been ordered but needed? which families of tests are incomplete? missing data is itself a clinical information to collect"], "did": [["Starts from the annual panel", "addressed", "All 26 markers of the CBC, CMP and lipid panel are the inner ring and the left rail. Each can be marked low or high; the ripple spreads from there."], ["Concerns each marker can represent", "addressed", "Derived from the catalogue's own concern tags: the 26 panel markers between them can raise <b>18 of 47</b> concerns. Calcium alone points at nine."], ["Click a concern for what would follow it up", "addressed", "Opening a concern fans its follow-up tests into an outer ring and lists them, ranked by how well sourced and how commonly ordered they are, each linking to its LOINC record."], ["Nothing shifts on interaction", "addressed", "Ring positions are computed once per window size and cached; every interaction changes colour and opacity only. All 47 concerns hold a permanent slot, so adding a personal concern moves nothing. Scroll areas use reserved gutters so a scrollbar never appears and nudges content."], ["Fun facts on how markers relate", "addressed", "<b>29 relationship notes</b>, each a verbatim quote from a MedlinePlus (NIH) page with a verify link — bilirubin coming from broken-down red cells, ALP living in both liver and bone, calcium riding on albumin, LDL being calculated rather than measured. All 29 were re-fetched and checked against their source pages: none altered, none missing."], ["Personal concern layer", "addressed", "The 29 concerns the annual panel cannot reach are addable as a second layer. Adding one that no panel marker touches says so plainly: <i>nothing in your routine bloodwork would reveal it</i>."], ["Missing data as clinical information", "addressed", "Marking one marker abnormal surfaces how many related tests sit outside the panel and have never been ordered. Across all 18 reachable concerns that is <b>3,399</b> tests."], ["A confirmed diagnostic sequence", "partial", "The follow-up lists are markers <b>tagged to a concern</b> in the catalogue, ranked — not a verified screen-then-confirm path. Only the 29 sourced notes and the 11 hand-authored conditions carry real sequencing. The panel says so rather than implying more."], ["Marker-to-marker network beyond the 29", "open", "Still blocked on the relationship layer from [[F1]]: 6 of 6,192 markers carry a cross-family link. The 29 notes are hand-curated, not a data model — they cover the annual panel and stop there."]], ], ["Overlay for drill-in", "addressed", "Clicking through to a family's markers fades a sheet over the map. The layout underneath never moves."]], "open": "The gap map still scrolls — you chose to workshop one screen first. Applying the same fixed language there is the obvious follow-on."}, {"id": "F4", "date": "2026-07-30", "who": "Chloe", "title": "Be explicit about what is actually live", "status": "addressed", "versions": ["v1.0"], "quote": "is the atlas version live on index?", "did": [["Status is now stated, not implied", "addressed", "Versions carry live / candidate / superseded and the panel colours the timeline by it. The atlas is a candidate; <code>index.html</code> is still v0.4."], ["Rollback commands are status-aware", "addressed", "A candidate shows &ldquo;promote this version&rdquo; and points its git command at <code>index-v2.html</code>, where the file actually lives at that tag. Earlier versions point at <code>index.html</code>."]], "open": null}, {"id": "F3", "date": "2026-07-30", "who": "Chloe", "title": "Version history with previews and rollback", "status": "addressed", "versions": ["v1.0"], "quote": "create a history record keeping panel for all the changes we have made, in case we need to roll back to older versions, make them previewable", "did": [["Snapshots of every milestone", "addressed", "Six versions plus two reference artifacts in <code>versions/</code>, byte-for-byte copies verified against their git tags."], ["Previewable", "addressed", "Each renders live in an iframe as the real interactive build, with viewport toggles and open-full."], ["Rollback", "addressed", "Copy-the-snapshot and git-tag commands per version, plus a diff command to see what would change first."], ["Uncommitted work rescued", "addressed", "The free-text symptom search was sitting in the working tree; committed as its own tagged milestone (v0.4) so that state stays recoverable."]], "open": "<code>versions/</code> is ~17 MB and will ride along on a Vercel deploy. That makes the panel shareable by URL, which seems worth it — say the word for a <code>.vercelignore</code>."}, {"id": "F2", "date": "2026-07-30", "who": "Chloe", "title": "Build the full scope, review before swapping", "status": "addressed", "versions": ["v1.0"], "quote": "implement the changes … Everything including R4 atlas … New file, review then swap", "did": [["All seven recommendations built", "addressed", "R1&ndash;R7 including the full atlas screen. The 6,192-row table survives one level inside it."], ["Delivered for review, not swapped in", "addressed", "<code>index-v2.html</code> sits alongside the live site so it can be compared before promotion."]], "open": null}, {"id": "F1", "date": "2026-07-30", "who": "Chloe", "title": "An atlas of blood, not another lab viewer", "status": "partial", "versions": ["v1.1", "v1.0"], "quote": "What we don't have is a model of the blood system itself. We don't know what other markers surround a result, what hasn't been measured, what should be measured next, or how biomarkers relate to one another across physiology.", "quotes": ["We already have good tools for seeing individual blood tests—and simple trends over time.", "Imagine a map instead of a list. Every blood marker exists within networks: inflammation, immunity, kidney function, metabolism, liver health, hormones, nutrition, coagulation, cancer, infection, genetics, and more. We need the “solar system” of blood markers, not isolated planets.", "The most valuable information may be what's missing. Which tests have never been ordered? Which families of tests are incomplete? … Missing data is itself clinical information.", "This is fundamentally a decision-space design problem.", "More data isn't the problem. Claude Shannon taught us that information reduces uncertainty. The challenge is designing interfaces that transform more information into better decisions instead of more confusion.", "The issue isn't the data itself. The problem is that we haven't designed an effective way for clinicians and patients to navigate it—to surface what's important, summarize the signals, expose the gaps, and reveal the relationships.", "The product isn't another lab viewer. It's a decision engine.", "The goal isn't simply to display blood work. It's to make the invisible structure of human physiology visible enough that clinicians and patients can ask better questions, order better tests, and make better decisions."], "did": [["A map instead of a list", "addressed", "The atlas screen shows all 17 families as a packed map sized by what is inside them, replacing a landing page whose only promise was 6,192 rows."], ["Missing data as the headline", "addressed", "The hero leads with <b>26 of 6,192</b> &mdash; what a routine annual panel measures against what is measurable. The stat strip shows three gaps instead of three totals."], ["Which families are incomplete", "addressed", "The gap map takes what you have had drawn and returns per-family coverage. <b>14 of 17</b> families are untouched by a standard annual panel."], ["The six decision questions", "partial", "All six are on the landing as navigation, each honestly labelled. Two work; two are prototypes; one is evidenced for three panels only; one is not built."], ["Which tests belong together", "partial", "Only the three routine panels are modelled as sets. Nothing else in the catalogue is grouped by &ldquo;ordered together&rdquo;."], ["How biomarkers relate across physiology", "open", "Not built, and deliberately not faked. Only <b>6 of 6,192</b> markers carry a link to another family, so the map draws no edges and says so."], ["How one abnormal finding ripples", "open", "Blocked on the same missing relationship layer. The one worked example (iron-deficiency anemia) is hand-authored in <code>condition-lens.html</code>."], ["What should be measured next", "partial", "Screen-then-confirm exists as a prototype for one condition, not as a general capability."], ["Trends over time", "open", "Not built. Named as not built on the landing rather than quietly omitted."], ["What each biomarker means, with evidence", "partial", "All 6,192 carry a description and a link, but only <b>216</b> are quoted from a named authority; <b>5,976</b> were AI-written from the LOINC name. The ratio is on the front door."]], "open": "The relationship layer is the blocker for three of the points above. The fix is two small additions alongside <code>tests</code> &mdash; a <code>sets</code> array for &ldquo;these are ordered together&rdquo; and an <code>edges</code> array for reflex links like low MCV &rarr; ferritin &mdash; each carrying its own quoted or reasoned source. Scoped in §5 of <code>INDEX-REFINEMENT.md</code>. Until it exists, any marker-level ripple view would be drawing edges that are not in the data."}], "versions": [{"id": "v2.1", "file": "v2.1-organic-ripple.html", "title": "Ripple atlas — organic layout", "date": "2026-07-31", "source": "index-v3.html", "status": "candidate", "tag": "v2.1-organic-ripple", "gitpath": "index-v3.html", "answers": ["F8"], "summary": "The ripple map stops being a fixed ring and becomes a live force simulation: nodes float, live concerns pull inward, dormant ones drift to the edge, and labels are placed only where they fit.", "changes": ["<b>Force simulation replaces the fixed rings.</b> A radial band per role, concerns sprung toward the markers that implicate them, universal repulsion, hard collision correction, and a boundary that keeps every node out of the panels.", "<b>Live concerns come forward, dormant ones recede.</b> The 47 concerns no longer each hold a permanent ring slot — the ones in play grow and move inward where there is room to label them.", "<b>Greedy label placement.</b> Labels are sorted by importance and take the first of four candidate positions that collides with nothing. Zero label overlaps at 1200×700 through 1920×1080, in every interaction state.", "<b>Elliptical bands</b> so the layout fills a wide rectangle instead of inscribing a circle in it.", "<b>Ambient drift</b> — per-node phase, slow breathing motion, disabled under <code>prefers-reduced-motion</code>.", "<b>Flowing dash on live edges</b> so the ripple visibly travels outward from a marker you flag.", "Node overlaps: zero once settled, at every size tested."], "note": "Motion is confined to the map canvas. The rails, detail slots and scroll gutters stay fixed, so this does not undo the no-shift guarantee from v2.0.", "mb": 0.1}, {"id": "v2.0", "file": "v2.0-ripple-atlas.html", "title": "Ripple atlas", "date": "2026-07-31", "source": "index-v3.html", "status": "superseded", "tag": "v2.0-ripple-atlas", "gitpath": "index-v3.html", "answers": ["F7"], "summary": "A different route into the atlas: start from the 26 markers of a routine annual panel, mark what came back abnormal, and watch the ripple spread into concerns and the tests that would follow them up.", "changes": ["<b>Three concentric rings.</b> Inner: the 26 annual-panel markers, grouped by CBC / CMP / lipid. Middle: all 47 concerns, each holding a permanent slot. Outer: the follow-up tests for whichever concern is open.", "<b>Mark low or high</b> on any panel marker and the concerns it can represent light up, with edges coloured by direction.", "<b>29 sourced relationship notes</b> — every one a verbatim MedlinePlus (NIH) quote with a verify link, re-checked against the source pages after authoring.", "<b>Personal concern layer.</b> The 29 concerns a routine panel cannot reach can be added by hand; one that no panel marker touches says so outright.", "<b>Nothing moves.</b> Ring geometry is computed once per window size and cached; interactions change colour and opacity only. Scroll areas reserve their gutters. Verified by diffing every circle coordinate across marking, selecting and adding.", "<b>Marker radius derived from the ring chord</b>, so the 26 inner circles cannot overlap at any window size. Checked at 1200×700 through 1920×1080.", "95 KB standalone — no 6,192-row table, so it loads instantly."], "note": "This is an alternative to the v1.1 family atlas, not a replacement. v1.1 maps the whole catalogue by family; v2.0 starts from what you have actually had done. Both are candidates.", "mb": 0.09}, {"id": "v1.1", "file": "v1.1-atlas-cockpit.html", "title": "Atlas cockpit — fixed panels", "date": "2026-07-30", "source": "index-v2.html", "status": "candidate", "tag": "v1.1-atlas-cockpit", "gitpath": "index-v2.html", "answers": ["F5"], "summary": "The atlas stops being a scrolling page and becomes a fixed cockpit: the map fills the viewport, everything else floats above it, nothing ever reflows.", "changes": ["<b>Nothing scrolls or resizes.</b> The stage is fixed; panels are absolutely positioned and hold their dimensions. Anything that could overflow scrolls inside its own box instead of growing.", "<b>Map is the ground plane.</b> It fills the viewport behind four floating glass panels — controls and family index on the left, detail on the right, legend and the honesty line along the bottom.", "<b>Circles never jump.</b> Positions are packed once per stage size and cached; toggling shade or re-ordering the index only re-paints colour. Verified by diffing circle coordinates across a shade toggle.", "<b>Packing is area-conserving</b> — circles scale to fill ~46% of whatever space the panels leave, so the map uses the room it has at any window size. Panel footprints are measured, not guessed, so no circle hides under a panel.", "<b>Detail panel is always mounted</b> at a fixed size. With nothing selected it shows the whole-atlas summary; selecting a family swaps the content without changing the box.", "<b>Drill-in is an overlay sheet</b> that fades over the map — every marker in the family, filterable, each linking to its LOINC record. Esc or the scrim closes it.", "Index and map cross-highlight on hover; clicking either selects, clicking again deselects.", "<b>No dimming of unselected families.</b> The shape of what is unmeasured is the point of the map, so it stays readable while you inspect one family."], "note": "The family-card grid from v1.0 is gone — the index rail and detail panel replace it. Landing and gap map are unchanged.", "mb": 2.92}, {"id": "v1.0", "file": "v1.0-atlas-rebuild.html", "title": "Atlas rebuild", "date": "2026-07-30", "source": "index-v2.html", "status": "superseded", "tag": "v1.0-atlas", "gitpath": "index-v2.html", "answers": ["F1", "F2", "F3", "F4"], "summary": "Landing reframed from a navigation question into a claim, plus two new screens: a gap map and a family atlas.", "changes": ["<b>Hero states the thesis.</b> “Where do you want to start?” becomes “There are 6,192 things that can be measured in your blood. A routine annual checkup measures 26.”", "<b>Stat strip shows gaps, not totals.</b> The volume pair (6,192 tests · 17 body systems) is replaced by 26 of 6,192 in a routine panel, 1,602 markers no symptom reaches, and 4 of 17 families with no quoted source.", "<b>New gap map</b> (<code>#cxGaps</code>) — mark the panels you’ve had, search in individual markers, see per-family coverage. Persists to <code>localStorage</code>.", "<b>New family atlas</b> (<code>#cxAtlas</code>) — 17 family cards, shade by routine-panel or source coverage, sort by size / least covered / A–Z.", "<b>Six-question spine</b> on the landing, each labelled built / prototype / partial / not built.", "<b>Family map generated from the payload</b> by deterministic circle packing. No edges drawn, because only 6 of 6,192 markers carry a link to another family.", "<b>Honesty band</b> — 216 quoted entries vs 5,976 AI-written, with source names read out of the data.", "Fixed two bugs found in testing: <code>[].slice.call()</code> on a <code>Set</code> returns empty, which had silently broken the added-markers list and localStorage persistence."], "note": "Every figure is computed from the payload at load, so the copy cannot drift from the dataset. Regenerate with <code>pipeline/build_v2.py</code>.", "mb": 2.91}, {"id": "v0.4", "file": "v0.4-symptom-search.html", "title": "Free-text symptom search", "date": "2026-07-30", "source": "index.html (working tree)", "status": "live", "tag": "v0.4-symptom-search", "answers": [], "diff": "196 added, 18 removed", "summary": "The last state of the original dashboard before the atlas rebuild. This is the roll-back target if the atlas goes wrong.", "changes": ["Free-text search on the condition explorer home (<code>cxFeelSearch</code>) with fuzzy matching into concern chips.", "“Search all tests” escape hatch from the search results into the table view.", "Feedback link added to the dashboard header.", "Blood-fill animation on the landing figure retuned (<code>cxrise</code> 120px → 185px)."], "note": "These edits were uncommitted when the atlas work began; committed as their own milestone so this exact state stays recoverable.", "mb": 2.87}, {"id": "v0.3", "file": "v0.3-polished-landing.html", "title": "Polished landing and table toolbar", "date": "2026-07-29", "ref": "2f8f5ec", "source": "commit 2f8f5ec", "tag": "v0.3-polish", "answers": [], "diff": "250 added, 25 removed", "summary": "Visual pass on the two-door landing and usability work on the all-tests table.", "changes": ["Landing figure with the blood-fill mask, animated leader lines to each route card, and live card stats read from the dataset.", "Per-system mini bar chart on the “Explore all tests” card.", "Table toolbar: expand all, collapse all, back to top, and a sticky toolbar dock.", "Rollup system bar with legend in the dashboard header."], "mb": 2.86}, {"id": "v0.2", "file": "v0.2-condition-explorer.html", "title": "Condition explorer prototype", "date": "2026-07-23", "ref": "1f7acac", "source": "commit 1f7acac", "tag": "v0.2-condition-explorer", "answers": [], "diff": "3,595 added, 81 removed", "summary": "The biggest single change in the project's history: conditions become a first-class object sitting between symptoms and tests.", "changes": ["Route landing (<code>#cxRoute</code>) with two doors — start from how you feel, or explore all tests.", "Condition explorer (<code>#cxApp</code>): symptom → candidate conditions → condition lens.", "Condition lens with ripple diagram, “have you had this?” checklist, path-to-diagnosis track and a locked miniDx card.", "All-tests table view with name / system / source filters.", "Added <code>condition-lens.html</code>, <code>IMPROVEMENT-PLAN.md</code> and the <code>pipeline/</code> source files."], "note": "This is the version <code>IMPROVEMENT-PLAN.md</code> was written against.", "mb": 2.85}, {"id": "v0.1", "file": "v0.1-initial-dashboard.html", "title": "Initial dashboard", "date": "2026-07-22", "ref": "786bfc5", "source": "commit 786bfc5", "tag": "v0.1-initial", "answers": [], "diff": "1,024 added", "summary": "The original concern-in, test-list-out tool. No conditions, no landing page, no table view.", "changes": ["6,192-test catalogue with the concern picker and age / sex / life-stage / medication filters.", "Rollup stat strip and callouts.", "“Worth asking your doctor about” ranking, and annual-panel coverage against what sits outside it.", "Source-quoted vs AI-generated badges throughout."], "mb": 2.69}], "references": [{"id": "ref-wireframe", "file": "ref-atlas-wireframe.html", "title": "Atlas landing wireframe (annotated)", "date": "2026-07-29", "summary": "The annotated mockup v1.0 was built from. Each block carries a margin note explaining what changed and why. Read alongside INDEX-REFINEMENT.md.", "mb": 0.02}, {"id": "ref-lens", "file": "ref-condition-lens.html", "title": "Condition lens — iron-deficiency anemia", "date": "2026-07-23", "summary": "Standalone, hand-authored prototype of one condition worked end to end: ripple, coverage, path to diagnosis, miniDx. The reference build the explorer was modelled on.", "mb": 0.04}]};
const TOTAL_MB = 17.3;
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const FB = MANIFEST.feedback, VS = MANIFEST.versions, RF = MANIFEST.references;
const ALL = [{id:'_overview'}].concat(FB, VS, RF);
const find = id => id==='_overview' ? {id:'_overview'} :
  FB.find(x=>x.id===id) || VS.find(x=>x.id===id) || RF.find(x=>x.id===id);
const isFb = o => FB.indexOf(o) >= 0;
const isRef = o => RF.indexOf(o) >= 0;

let current = '_overview';
let vpWidth = 0;

const cnt = {addressed:0, partial:0, open:0};
FB.forEach(f => cnt[f.status]++);
$('hdrMeta').textContent = FB.length + ' feedback · ' + cnt.addressed + ' addressed · '
  + cnt.partial + ' partial · ' + cnt.open + ' open · ' + VS.length + ' versions · ' + TOTAL_MB + ' MB';
$('fHead').innerHTML = 'Feedback <em>' + FB.length + ' items</em>';

/* ---------------- rail ---------------- */
function item(v, kind){
 const trim = s => s.length > 92 ? s.slice(0,89) + '…' : s;
 return '<button class="vitem' + (v.id===current?' on':'') + (v.status?' st-'+v.status:'') + '" data-v="' + v.id + '">'
  + '<span class="vt"><span class="vid">' + esc(kind==='ref' ? 'ref' : v.id) + '</span>'
  + (v.status ? '<span class="chip ' + v.status + '">' + v.status + '</span>' : '')
  + '<span class="vd">' + esc(v.date||'') + '</span></span>'
  + '<span class="vn">' + esc(v.title) + '</span>'
  + '<span class="vs">' + esc(trim(v.summary || v.quote || '')) + '</span>'
  + '</button>';
}
function drawRail(){
 $('oList').innerHTML = '<button class="vitem' + (current==='_overview'?' on':'') + '" data-v="_overview">'
  + '<span class="vt"><span class="vid">overview</span></span>'
  + '<span class="vn">Where things stand</span>'
  + '<span class="vs">The ledger, what is still open, and the standing rules.</span></button>';
 $('fList').innerHTML = FB.map(f => item(f,'fb')).join('');
 $('vList').innerHTML = VS.map(v => item(v,'v')).join('');
 $('rList').innerHTML = RF.map(v => item(v,'ref')).join('');
}

/* ---------------- renderers ---------------- */
function linkChips(ids, label){
 if(!ids || !ids.length) return '';
 return '<div class="links"><span style="font-family:var(--font-mono);font-size:10px;color:var(--dim);'
  + 'text-transform:uppercase;letter-spacing:.05em;align-self:center;margin-right:3px">' + label + '</span>'
  + ids.map(id => { const o = find(id); return o ? '<button class="lk" data-v="' + id + '"><b>' + esc(id)
      + '</b> &middot; ' + esc(o.title) + '</button>' : ''; }).join('') + '</div>';
}

function drawOverview(){
 const openRows = [];
 FB.forEach(f => {
  (f.did||[]).forEach(d => { if(d[1] !== 'addressed') openRows.push({f:f, t:d[0], s:d[1], r:d[2]}); });
 });
 let h = '<div class="phead"><h1>Where things stand</h1></div>'
  + '<p class="pmeta"><span>' + MANIFEST.generated.slice(0,10) + '</span><span>'
  + FB.length + ' feedback items</span><span>' + VS.length + ' versions</span></p>'
  + '<p class="psum">Everything asked for so far, what was done about it, and what is still outstanding. '
  + 'Feedback is quoted rather than paraphrased, per the project rule.</p>';

 h += '<div class="tiles">'
  + '<div class="tile a"><b>' + cnt.addressed + '</b><span>feedback items fully addressed</span></div>'
  + '<div class="tile b"><b>' + cnt.partial + '</b><span>partly addressed &mdash; something remains</span></div>'
  + '<div class="tile c"><b>' + openRows.length + '</b><span>individual threads still open or partial</span></div>'
  + '</div>';

 h += '<div class="sec"><h2>The ledger</h2><table class="ledger"><thead><tr>'
  + '<th style="width:44px">id</th><th>asked for</th><th style="width:86px">status</th><th style="width:104px">answered in</th>'
  + '</tr></thead><tbody>'
  + FB.map(f => '<tr data-v="' + f.id + '"><td class="lid">' + esc(f.id) + '</td>'
    + '<td><span class="ltt">' + esc(f.title) + '</span></td>'
    + '<td><span class="chip ' + f.status + '">' + f.status + '</span></td>'
    + '<td class="lv">' + (f.versions.length ? f.versions.map(esc).join(', ') : '&mdash;') + '</td></tr>').join('')
  + '</tbody></table></div>';

 if(openRows.length){
  h += '<div class="sec"><h2>Still open</h2>'
   + '<p class="sub">Named rather than quietly dropped &mdash; the same standard the product holds itself to about unmeasured markers.</p>'
   + '<ul class="did">'
   + openRows.map(o => '<li><span class="st ' + o.s + '">' + o.s + '</span><div>'
      + '<p class="tt">' + o.t + ' <span style="font-family:var(--font-mono);font-size:10px;color:var(--dim);font-weight:400">'
      + esc(o.f.id) + '</span></p><p class="rr">' + o.r + '</p></div></li>').join('')
   + '</ul></div>';
 }

 h += '<div class="sec"><h2>Standing rules</h2><ul class="cons">'
  + MANIFEST.constraints.map(c => '<li><b>' + esc(c[0]) + '</b>' + c[1] + '</li>').join('')
  + '</ul></div>';

 h += '<p class="foot">Add new feedback to the <code>FEEDBACK</code> list at the top of '
  + '<code>pipeline/build_history.py</code> and re-run it. A version records which feedback it answers in its '
  + '<code>answers</code> field, and the panel resolves the link in both directions, so the two lists cannot '
  + 'disagree. Machine-readable: <code>versions/manifest.json</code>.</p>';
 return h;
}

function drawFeedback(f){
 let h = '<div class="phead"><h1>' + esc(f.title) + '</h1>'
  + '<span class="pid ' + f.status + '">' + esc(f.id) + ' &middot; ' + f.status + '</span></div>'
  + '<div class="pmeta"><span>' + esc(f.date) + '</span><span>from ' + esc(f.who) + '</span>'
  + '<span>' + (f.did||[]).length + ' threads</span></div>';

 const qs = (f.quotes && f.quotes.length) ? f.quotes : [f.quote];
 h += '<div class="sec"><h2>What was said</h2><blockquote class="quotes">'
  + qs.map(q => '<p>&ldquo;' + esc(q) + '&rdquo;</p>').join('')
  + '<p class="qattr">&mdash; ' + esc(f.who) + ', ' + esc(f.date) + ', verbatim</p></blockquote></div>';

 if(f.did && f.did.length){
  h += '<div class="sec"><h2>What was done</h2><ul class="did">'
   + f.did.map(d => '<li><span class="st ' + d[1] + '">' + d[1] + '</span><div>'
      + '<p class="tt">' + d[0] + '</p><p class="rr">' + d[2] + '</p></div></li>').join('')
   + '</ul></div>';
 }
 if(f.open) h += '<div class="note warn"><h4>Still open</h4>' + f.open + '</div>';
 h += linkChips(f.versions, 'answered in');
 return h;
}

const VPS = [['Full','0'],['Tablet','834'],['Phone','390']];

function drawVersion(v){
 const ref = isRef(v);
 const path = 'versions/' + v.file;
 let h = '<div class="phead"><h1>' + esc(v.title) + '</h1>'
  + '<span class="pid' + (v.status ? ' ' + v.status : '') + '">' + esc(ref ? 'reference' : v.id)
  + (v.status ? ' · ' + v.status : '') + '</span></div>'
  + '<div class="pmeta"><span>' + esc(v.date) + '</span>'
  + (v.source ? '<span>from ' + esc(v.source) + '</span>' : '')
  + (v.diff ? '<span>' + esc(v.diff) + '</span>' : '')
  + '<span>' + v.mb + ' MB</span><span>versions/' + esc(v.file) + '</span></div>'
  + '<p class="psum">' + esc(v.summary) + '</p>';

 if(v.answers && v.answers.length) h += linkChips(v.answers, 'answers');

 h += '<div class="ptools" style="margin-top:14px"><span class="lab">viewport</span>'
  + VPS.map(p => '<button class="ptool' + (String(vpWidth)===p[1]?' on':'') + '" data-vp="' + p[1] + '">' + p[0] + '</button>').join('')
  + '<span class="spacer"></span>'
  + '<a class="popen" href="' + path + '" target="_blank" rel="noopener">Open full &nearr;</a></div>'
  + '<div class="frame"><div class="load" id="ld">loading ' + v.mb + ' MB…<br>large single-file build, give it a moment</div>'
  + '<div class="vp" id="vp"' + (vpWidth ? ' style="width:' + vpWidth + 'px"' : '') + '>'
  + '<iframe id="fr" title="Preview of ' + esc(v.title) + '" src="' + path + '"></iframe></div></div>'
  + '<p class="fnote">Live preview — this is the real build, fully interactive. Click around inside it.</p>';

 if(v.changes && v.changes.length){
  h += '<div class="sec"><h2>What changed</h2><ul class="chg">'
   + v.changes.map(c => '<li>' + c + '</li>').join('') + '</ul></div>';
 }
 if(v.note) h += '<div class="note">' + v.note + '</div>';

 if(!ref){
  const gp = v.gitpath || 'index.html';
  const promote = v.status === 'candidate';
  h += '<div class="sec"><h2>' + (promote ? 'Promote this version to live' : 'Roll back to this version') + '</h2><div class="roll">'
   + '<h3>' + (promote ? 'Not live yet' : 'Two ways, same result') + '</h3>'
   + '<p>' + (promote
      ? 'This build sits alongside the live site as <code>' + esc(gp) + '</code> so you can review it first. Copying the snapshot over <code>index.html</code> is what makes it live — and every earlier version stays in this panel, so the move is reversible.'
      : 'The snapshot is a complete standalone build, so copying it over <code>index.html</code> is enough. The git route is equivalent and keeps the move in your history.')
   + '</p>'
   + '<p class="rolllab">' + (promote ? 'Swap it in' : 'Copy the snapshot') + '</p>'
   + cmd('cp versions/' + v.file + ' index.html')
   + (v.tag ? '<p class="rolllab">Or take it from the tag</p>' + cmd('git checkout ' + v.tag + ' -- ' + gp) : '')
   + '<p class="rolllab">See exactly what would change first</p>'
   + cmd('diff <(git show ' + (v.tag||'HEAD') + ':' + gp + ') index.html | head')
   + '</div></div>';
 }
 h += '<p class="foot">Snapshots in <code>versions/</code> are byte-for-byte copies — nothing is reconstructed, '
  + 'so what you preview is exactly what you would roll back to.</p>';
 return h;
}
function cmd(text){
 return '<div class="cmd"><code>' + esc(text) + '</code><button data-copy="' + esc(text) + '">copy</button></div>';
}

function draw(){
 const o = find(current);
 $('pwrap').innerHTML = current==='_overview' ? drawOverview()
                      : isFb(o) ? drawFeedback(o) : drawVersion(o);
 const fr = $('fr'), ld = $('ld');
 if(fr) fr.addEventListener('load', () => ld && ld.classList.add('gone'));
 $('pane').scrollTop = 0;
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
 const v = e.target.closest('[data-v]');
 if(v){ current = v.dataset.v; drawRail(); draw(); $('pane').scrollTop = 0; return; }
 const p = e.target.closest('[data-vp]');
 if(p){ vpWidth = +p.dataset.vp; draw(); return; }
 const c = e.target.closest('[data-copy]');
 if(c){
  const txt = c.dataset.copy;
  const done = () => { c.textContent='copied'; c.classList.add('done');
                       setTimeout(()=>{ c.textContent='copy'; c.classList.remove('done'); },1400); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
  function fallback(){
   const ta=document.createElement('textarea'); ta.value=txt;
   ta.style.position='fixed'; ta.style.opacity='0';
   document.body.appendChild(ta); ta.select();
   try{ document.execCommand('copy'); done(); }catch(err){}
   document.body.removeChild(ta);
  }
 }
});
document.addEventListener('keydown', function(e){
 if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
 if(e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
 const i = ALL.findIndex(v => v.id===current);
 const n = e.key==='ArrowDown' ? i+1 : i-1;
 if(n<0 || n>=ALL.length) return;
 e.preventDefault(); current = ALL[n].id; drawRail(); draw();
});

drawRail(); draw();
</script>
</body>
</html>
